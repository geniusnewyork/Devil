services:
  - type: web
    name: monty-genius-link-hub
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: "file:/var/data/monty_genius.db"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_USERNAME
        value: Genius
      - key: ADMIN_INITIAL_PASSWORD
        value: Genius
    disk:
      name: monty-data
      mountPath: /var/data
      sizeGB: 1
